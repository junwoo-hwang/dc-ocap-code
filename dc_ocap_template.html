<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>DC OCAP</title>
<script>/*__PLOTLY_JS__*/</script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', 'Malgun Gothic', Arial, sans-serif;
    margin: 0; padding: 24px; color: #0f172a; background: #ffffff;
  }
  h1 { margin: 0 0 20px 0; font-size: 2rem; }
  /* the counts and the timestamp share one style so they render alike;
     both live inside the h1 so 0.42em resolves against the same size */
  h1 .ts { font-size: 0.42em; font-weight: 400; color: #888; line-height: 1.35; }
  h1 .ts.counts { display: inline-block; vertical-align: bottom; }
  /* 윗줄: DC HOLD 링크(오른쪽 끝). 아랫줄: 제목(왼쪽) + 데이터 시각(오른쪽).
     둘 다 패널과 같은 폭이라 오른쪽 정렬이 곧 패널 끝선이 된다.
     왼쪽 컬럼도 헤더가 두 줄(제목+필터 / 제품전환)이라 이렇게 두 줄로 두면
     양쪽 패널 윗선이 같은 높이에서 시작한다. */
  /* 3px: 왼쪽 헤더(제목+필터 / 제품전환)보다 이쪽이 딱 그만큼 높아서,
     이 여백으로 깎아야 양쪽 패널 윗선이 같은 높이에 온다 */
  .trend-head { margin-bottom: 2px; }
  .trend-head-top { text-align: right; margin-bottom: 6px; }
  .trend-head-bottom {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem;
  }
  .trend-head-bottom h2 { margin: 0; }
  .trend-head-bottom .stamp-line { font-size: 0.8rem; color: #888; }
  a.dc-hold-link {
    /* line-height 를 못 박아 둔다 (app.py 와 동일 규격) */
    display: inline-block; padding: 3px 14px; line-height: 1.35;
    border: 1px solid #d0d3d9; border-radius: 8px;
    background: #fff; color: #d33; font-size: 0.85rem; font-weight: 700;
    text-decoration: none;
  }
  a.dc-hold-link:hover { background: #fff1f0; border-color: #d33; }
  h2 { margin: 0 0 8px 0; font-size: 1.4rem; }
  .layout { display: flex; gap: 24px; align-items: flex-start; }
  .left { flex: 2; min-width: 0; }
  .right { flex: 3; min-width: 0; }

  .header-row { display: flex; align-items: center; gap: 16px; margin-bottom: 6px; }
  .list-title { font-size: 1.15rem; font-weight: 700; }
  .header-row2 { display: flex; justify-content: flex-end; margin-bottom: 8px; }

  .seg { display: inline-flex; border: 1px solid #d0d3d9; border-radius: 8px; overflow: hidden; }
  .seg button {
    border: none; background: #fff; padding: 0.15rem 0.55rem; font-size: 0.8rem;
    cursor: pointer; color: #333; border-right: 1px solid #d0d3d9;
  }
  .seg button:last-child { border-right: none; }
  .seg button.active { background: #fff1f0; color: #d33; font-weight: 600; }
  .seg.stretch { display: flex; width: 100%; }
  .seg.stretch button { flex: 1; }

  .panel {
    border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px;
    overflow: auto; background: #fff;
  }
  .caption { color: #667085; font-size: 0.85rem; margin: 4px 0; }
  .info-box { background: #e8f0fe; color: #1a56db; border-radius: 6px; padding: 12px; font-size: 0.9rem; }
  .warning-box { background: #fff7e6; color: #93650b; border-radius: 6px; padding: 10px; font-size: 0.85rem; margin-bottom: 6px; }

  table.data-table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
  table.data-table th {
    text-align: left; padding: 6px 8px; border-bottom: 1px solid #e2e8f0;
    color: #667085; font-weight: 600; position: sticky; top: 0; background: #fff;
    cursor: pointer; user-select: none; white-space: nowrap;
  }
  table.data-table th:hover { color: #333; }
  table.data-table th .sort-arrow { display: inline-block; width: 1em; color: #d33; }
  .search-box {
    width: 100%; box-sizing: border-box; margin-bottom: 8px; padding: 6px 10px;
    border: 1px solid #d0d3d9; border-radius: 6px; font-size: 0.85rem;
  }
  table.data-table td { padding: 6px 8px; border-bottom: 1px solid #f1f3f5; white-space: nowrap; }
  table.data-table tbody tr { cursor: pointer; }
  table.data-table tbody tr:hover { background: #f8fafc; }
  table.data-table tbody tr.selected { background: #fff1f0; }
  table.data-table tbody tr.selected td:first-child { box-shadow: inset 3px 0 0 #d33; }

  #listPanel { height: 400px; }
  #detailPanel { height: 250px; margin-top: 10px; }
  /* trend 는 왼쪽 list 와 같은 높이, comment 는 detail 과 같은 높이 */
  #trendPanel { height: 400px; }
  #commentPanel { height: 250px; margin-top: 10px; }

  .nav-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .nav-row button.nav-arrow {
    border: 1px solid #d0d3d9; background: #fff; border-radius: 6px; padding: 4px 10px; cursor: pointer;
  }
  .nav-row button.nav-arrow:disabled { color: #ccc; cursor: default; }
  .nav-row .item-label { flex: 0 0 auto; min-width: 160px; text-align: center; }
  .nav-row .item-label b { font-size: 1rem; }
  .nav-row .item-label span { color: #888; font-size: 0.85rem; }
  .nav-row .gap { flex: 1; }
  .nav-row select {
    border: 1px solid #d0d3d9; border-radius: 6px; padding: 4px 8px; font-size: 0.85rem;
  }
  .nav-row button.reset-btn {
    border: 1px solid #d0d3d9; background: #fff; border-radius: 6px; padding: 4px 12px;
    cursor: pointer; font-size: 0.85rem;
  }

  #chartDiv { width: 100%; }

  textarea#commentText {
    width: 100%; box-sizing: border-box; resize: vertical;
    border: 1px solid #d0d3d9; border-radius: 6px; padding: 8px;
    color: #000; font-size: 1.05rem; background: #f4f5f7; font-family: inherit;
  }
  .disposition { font-size: 0.9em; line-height: 1.7; margin-top: 6px; }

  /* ---- 페이지 전환 (DC OCAP / WAC Trend) ---- */
  .seg.page-switch { margin-bottom: 14px; }
  .seg.page-switch button { padding: 0.3rem 1.1rem; font-size: 0.9rem; font-weight: 600; }

  /* ---- WAC Trend 페이지 ---- */
  .wac-search { margin-bottom: 0; flex: 1; }
  .wac-stamp { font-size: 0.8rem; color: #888; text-align: right; }
  /* 가로 2개 고정, 세로로는 item 수만큼 */
  .wac-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 4px; }
  .wac-chart { border: 1px solid #e2e8f0; border-radius: 8px; padding: 8px; }
  .wac-chart .wac-chart-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 2px; }
  .wac-chart .wac-nolimit { font-size: 0.75rem; color: #b45309; margin-bottom: 2px; }
</style>
</head>
<body>
<div id="app">
  <div class="seg page-switch" id="pageSwitch">
    <button data-val="dcocap" class="active">DC OCAP</button>
    <button data-val="wac">WAC Trend</button>
  </div>

  <div id="pageDcOcap">
  <h1>Hold 현황 <span class="ts counts" id="newHoldCounts"></span></h1>

  <div class="layout">
    <div class="left">
      <div class="header-row">
        <div class="list-title">DC OCAP List</div>
        <div class="seg" id="statusFilter">
          <button data-val="전체">전체</button>
          <button data-val="hold" class="active">hold</button>

              <th data-col="owner">owner<span class="sort-arrow"></span></th>
            </tr>
          </thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>

      <div class="panel" id="detailPanel"></div>
    </div>

    <div class="right">
      <!-- 제목과 링크/시각을 한 줄에. align-items:flex-end 라 오른쪽 블록의
           아랫줄이 제목 밑선과 나란히 떨어지고, 바로 아래 패널과 붙는다.
           href 는 반드시 절대주소 -- "go/dcocap" 만 쓰면 현재 페이지 기준
           상대경로로 붙어 포털 안쪽 주소로 샌다. 정적 리포트는 iframe 안에서
           열리므로 target="_blank" 로 바깥 탭에 띄운다. -->
      <div class="trend-head">

        </div>
        <div class="trend-head-bottom">
          <h2>Item Trend</h2>
          <div class="stamp-line">(Latest Data : __GENERATED_AT__)</div>
        </div>
      </div>
      <div class="panel" id="trendPanel"></div>
      <div class="panel" id="commentPanel"></div>
    </div>
  </div>
  </div><!-- /pageDcOcap -->

  <div id="pageWac" hidden>
    <h1>WAC Trend <span class="ts counts" id="wacCounts"></span></h1>
    <div class="layout">
      <div class="left">
        <div class="header-row">
          <div class="list-title">ITEM Trend</div>
          <input type="text" id="wacSearch" class="search-box wac-search"
                 placeholder="item_id 검색 (예: item3)">
        </div>
        <div class="header-row2">
          <div class="seg stretch" id="wacProductSwitch">
            <button data-val="ULY" class="active">ULY</button>
            <button data-val="TTS">TTS</button>

          </div>
        </div>
      </div>
      <div class="right">
        <div class="wac-stamp">(Latest Data : __GENERATED_AT__)</div>
      </div>
    </div>
    <div id="wacGrid" class="wac-grid"></div>
    <div id="wacEmpty" class="info-box" hidden></div>

<script>
// The dataset ships gzipped and base64-wrapped (see build_dc_ocap_html()),
// so it arrives as text but has to be inflated before anything can read
// it. That makes startup async -- DATA stays null until boot() below
// fills it in, and nothing may touch it before then.
const DATA_B64 = "__DATA_B64__";
let DATA = null;

// build_dc_ocap_html() ships dc/trend as {column: [values]} rather than
// one object per row -- with ~150 days of trend history and 20+ item
// columns, repeating every column name on every row was most of the
// file's size. Expand it back into the row-object shape the rest of
// this file expects, once, up front.
function expandColumnar(colObj) {
  const keys = Object.keys(colObj);
  if (keys.length === 0) return [];
  const n = colObj[keys[0]].length;
  const rows = new Array(n);
  for (let i = 0; i < n; i++) {
    const row = {};
    for (const k of keys) row[k] = colObj[k][i];
    rows[i] = row;
  }
  return rows;
}

async function loadData() {
  const bin = atob(DATA_B64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  // DecompressionStream is built into the browser -- no library to load,
  // which matters because this file may be served somewhere with no
  // outbound internet access
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  const parsed = JSON.parse(await new Response(stream).text());
  for (const p of Object.keys(parsed.dc)) parsed.dc[p] = expandColumnar(parsed.dc[p]);
  for (const p of Object.keys(parsed.trend)) parsed.trend[p] = expandColumnar(parsed.trend[p]);
  return parsed;
}

const META_TREND_COLS = ["root_lot_id","wafer_id","tkout_time","probe_card_id","eqp_id","lot_type","rw_cnt"];
const LEGEND_FIELD_OPTIONS = {
  "없음 (기본)": null,
  "probe_card_id": "probe_card_id",
  "eqp_id": "eqp_id",
  "lot_type": "lot_type",
  "rw_cnt": "rw_cnt",
};
const HOVER_TEMPLATE =
  "root_lot_id=%{customdata[0]}<br>" +
  "wafer_id=%{customdata[1]}<br>" +
  "tkout_time=%{customdata[2]}<br>" +
  "probe_card_id=%{customdata[3]}<br>" +
  "eqp_id=%{customdata[4]}<br>" +
  "lot_type=%{customdata[5]}<br>" +
  "rw_cnt=%{customdata[6]}<extra></extra>";
const LIMIT_COLORS = { scrap: "red", control: "blue" };
const CATEGORY_COLORS = [
  "#2ca02c", "#9467bd", "#8c564b", "#bcbd22", "#17becf",
  "#e377c2", "#7f7f7f", "#1b9e77", "#a6761d", "#66a61e",
  "#5d4037", "#8e6c8a", "#93a01e", "#4d4d4d", "#c49a6c",
  "#7fbf7b", "#af8dc3", "#d9a441", "#2f6f4e", "#6b4f8a",
];

// ---- state (mirrors show_dc_ocap()'s st.session_state usage) ----
const state = {
  product: "ULY",
  statusFilter: "hold",
  page: "dcocap",          // "dcocap" | "wac"
  wacSelected: null,       // {rootLotId, waferId} -- 모든 WAC 차트에 동시 적용
  wacSearch: "",
  selectedLotId: null,
  selectedRwCnt: null,
  itemIdxByKey: {},
  focusedWafer: null, // {product, itemId, rootLotId, waferId}
  legendField: null,
  sortCol: "hold_time",
  sortDir: "desc",
  searchText: "",
};
// status is deliberately not here: it decides hold vs 이력 (see
// filterByStatus), but a flowed lot turns into ship a few days later,
// so as a displayed value it just goes stale. Mirrors GROUP_COLS.
const LIST_COLS = ["rw_cnt", "hold_time", "lot_id", "wafer_id", "item", "hold_inform", "code", "owner"];

// ---- pure helpers (ports of app.py's norm_lot / norm_wafer / etc.) ----
function normLot(v) { return String(v).trim(); }

function normWafer(v) {
  const s = String(v).trim();
  return /^-?\d+$/.test(s) ? parseInt(s, 10) : s;
}

// mirrors norm_rw_cnt() in app.py: the list groups on (lot_id, rw_cnt) and
// everything on the right is looked up with that pair, so a missing rw_cnt
// (null/NaN) and 0 vs 0.0 both have to land on one key -- otherwise the row
// sits in the list with an empty chart beside it
function normRwCnt(v) {
  if (v === null || v === undefined) return "";
  if (typeof v === "number" && !Number.isFinite(v)) return "";
  const s = String(v).trim();
  if (s === "" || s === "NaN" || s === "None" || s === "null") return "";
  const n = Number(s);
  return Number.isFinite(n) ? String(Math.trunc(n)) : s;
}

function toFloat(v) {
  if (v === null || v === undefined || v === "") return null;
  const n = Number(v);
  return Number.isFinite(n) ? n : null;
}

function pairKey(root, wafer) { return normLot(root) + "||" + normWafer(wafer); }

function uniqueOrdered(values) {
  const seen = new Set();
  const out = [];
  for (const v of values) { if (!seen.has(v)) { seen.add(v); out.push(v); } }
  return out;
}

function dedupeNonBlank(values) {
  const seen = new Set();
  const out = [];
  for (const v of values) {
    if (v === null || v === undefined) continue;
    const s = String(v).trim();
    if (!s || seen.has(s)) continue;
    seen.add(s);
    out.push(s);
  }
  return out;
}

function sortWafers(values) {
  const normed = new Set(values.map(normWafer));
  const nums = [...normed].filter(v => typeof v === "number").sort((a, b) => a - b);
  const rest = [...normed].filter(v => typeof v !== "number").map(String).sort();
  return nums.concat(rest);
}

function summarize(values) {
  const seen = dedupeNonBlank(values);
  if (seen.length === 0) return "";
  return seen.length === 1 ? seen[0] : `${seen[0]}외 ${seen.length - 1}건`;
}

function formatDisposition(rows) {
  if (rows.length === 0) return null;
  const comments = dedupeNonBlank(rows.map(r => r.comment));
  const owners = dedupeNonBlank(rows.map(r => r.owner));
  if (comments.length === 0 && owners.length === 0) return null;
  const codes = dedupeNonBlank(rows.map(r => r.code));
  return {
    comment: comments.length ? comments.join("\n") : "-",
    owner: owners.length ? owners.join(" / ") : "-",
    code: codes.length ? codes.join(" / ") : "-",
  };
}

// How many rows the list shows under the "hold" filter. Runs the list's
// own filter AND grouping rather than re-deriving anything here, so the
// header count can never drift from the rows underneath it -- counting
// distinct lot_ids would undercount now that one lot can produce several
// rows (one per rw_cnt).
function countNewHolds(dcRows) {
  return groupHolds(filterByStatus(dcRows, "hold")).length;
}

// "조치가 안 됨" = code/owner 가 둘 다 비어있고 + status 가 정확히 'Hold'.
// dc 는 30분마다 갱신되지만 owner/comment 는 다음날 아침에야 적재되므로,
// 코멘트를 달고 flow 시킨 건이 하루 동안 hold 에 남는 것을 막으려면
// 제때 갱신되는 status 를 같이 봐야 합니다.
// 'Hold' 가 아닌 것은 빈 값도 포함해서 전부 이력입니다 (app.py 와 동일).
function filterByStatus(dcRows, view) {
  if (view === "전체") return dcRows;
  const blank = (v) => v === null || v === undefined || String(v).trim() === "";
  // dc 에 status 컬럼이 아예 없으면 예전처럼 code/owner 만 본다.
  // app.py 의 `if "status" in dc_df.columns` 와 같은 뜻 -- 이걸 빼면
  // status 없는 dc 에서 hold 가 통째로 0건이 되어 파이썬과 갈린다.
  const hasStatus = dcRows.length > 0 &&
    Object.prototype.hasOwnProperty.call(dcRows[0], "status");
  const undisp = dcRows.filter(r =>
    blank(r.code) && blank(r.owner) &&
    (!hasStatus || String(r.status ?? "").trim() === "Hold")
  );
  if (view === "hold") return undisp;
  const undispSet = new Set(undisp);
  return dcRows.filter(r => !undispSet.has(r));
}

// One row per (lot_id, rw_cnt). rw_cnt is part of the key rather than
// summarized away: a lot held again after a rework is a separate event
// with its own hold_time and disposition, so collapsing both into one
// row would hide the later one entirely.
function groupHolds(dcRows) {
  const order = [];
  const groups = new Map();
  for (const r of dcRows) {
    const key = String(r.lot_id) + "||" + normRwCnt(r.rw_cnt);
    if (!groups.has(key)) { groups.set(key, []); order.push(key); }
    groups.get(key).push(r);
  }
  const rows = order.map(key => {
    const grp = groups.get(key);
    let holdTime = null;
    for (const r of grp) { if (r.hold_time && (!holdTime || r.hold_time > holdTime)) holdTime = r.hold_time; }
    return {
      rw_cnt: grp[0].rw_cnt ?? "",
      hold_time: holdTime,
      lot_id: grp[0].lot_id,
      wafer_id: sortWafers(grp.map(r => r.wafer_id)).join(","),
      item: summarize(grp.map(r => r.item_id)),
      hold_inform: summarize(grp.map(r => r.hold_inform)),
      code: summarize(grp.map(r => r.code)),
      owner: summarize(grp.map(r => r.owner)),
    };
  });
  // newest first as before; rw_cnt descending breaks ties so a rework
  // sits above the original even when both carry the same hold_time
  rows.sort((a, b) => {
    const t = (b.hold_time || "").localeCompare(a.hold_time || "");
    if (t !== 0) return t;
    return Number(b.rw_cnt || 0) - Number(a.rw_cnt || 0);
  });
  return rows;
}

function resolveItemCol(product, itemId) {
  const cols = DATA.itemCols[product];
  if (cols.includes(itemId)) return itemId;
  const key = String(itemId).trim().toLowerCase();
  const matches = cols.filter(c => String(c).trim().toLowerCase() === key);
  return matches.length === 1 ? matches[0] : null;
}

function formatHoverTime(iso) {
  if (!iso) return "";
  return iso.replace("T", " ").split(".")[0];
}

function formatDisplayTime(iso) {
  if (!iso) return "";
  return iso.replace("T", " ").split(".")[0];
}

// ---- DOM helper ----
function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("data-")) e.setAttribute(k, v);
    else e[k] = v;
  }
  for (const c of children) e.appendChild(c);
  return e;
}

// ---- chart building (port of build_scatter) ----
function buildScatterTraces(product, itemCol, badPairs, badLabel, legendField, ucl, lcl, usl, lsl, focusPair) {
  ucl = toFloat(ucl); lcl = toFloat(lcl); usl = toFloat(usl); lsl = toFloat(lsl);

  const trend = DATA.trend[product];
  const rows = [];
  for (const r of trend) {
    const raw = r[itemCol];
    if (raw === null || raw === undefined) continue;
    const val = Number(raw);
    if (!Number.isFinite(val)) continue;
    rows.push({ ...r, _val: val, _hoverTime: formatHoverTime(r.tkout_time) });
  }

  const badLots = new Set([...badPairs].map(p => p.split("||")[0]));
  const isBad = (r) => badPairs.has(pairKey(r.root_lot_id, r.wafer_id));
  const pastScrap = (r) => (usl !== null && r._val > usl) || (lsl !== null && r._val < lsl);
  const pastControl = (r) => !pastScrap(r) && ((ucl !== null && r._val > ucl) || (lcl !== null && r._val < lcl));

  const bad = rows.filter(r => isBad(r));
  // exact-zero readings are almost always measurement glitches, not real
  // excursions -- dropped from the background context points only, so a
  // handful of them don't blow out the y-axis. Held wafers are exempt: a
  // hold is often triggered by exactly this kind of extreme value, and
  // hiding it would hide the reason it was held in the first place.
  const others = rows.filter(r => !isBad(r) && r._val !== 0);

  const traces = [];
  function customdata(grp) {
    return grp.map(r => [r.root_lot_id, r.wafer_id, r._hoverTime, r.probe_card_id, r.eqp_id, r.lot_type, r.rw_cnt]);
  }
  function addGroup(grp, color, name, rank, isBadGroup) {
    if (grp.length === 0) return;
    const marker = isBadGroup
      ? { color, size: 11, line: { width: 1, color: "black" } }
      : { color, size: 7 };
    traces.push({
      x: grp.map(r => r.tkout_time),
      y: grp.map(r => r._val),
      mode: "markers", marker, name,
      legendrank: rank,
      customdata: customdata(grp),
      hovertemplate: HOVER_TEMPLATE,
    });
  }

  if (!legendField) {
    const sameLot = others.filter(r => badLots.has(normLot(r.root_lot_id)));
    const notSameLot = others.filter(r => !badLots.has(normLot(r.root_lot_id)));
    addGroup(notSameLot, "lightgray", "other", 1100, false);
    addGroup(sameLot, "dimgray", [...badLots].sort().join(","), 1050, false);
  } else {
    const groups = new Map();
    for (const r of others) {
      const raw = r[legendField];
      const key = (raw === null || raw === undefined) ? " NA" : String(raw);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(r);
    }
    const keys = [...groups.keys()].sort();
    keys.forEach((key, i) => {
      const label = key === " NA" ? "(없음)" : key;
      addGroup(groups.get(key), CATEGORY_COLORS[i % CATEGORY_COLORS.length], label, 1000 + i, false);
    });
  }

  function addBad(subset, color, rank) {
    if (subset.length === 0) return;
    const wafers = sortWafers(subset.map(r => r.wafer_id)).join(",");
    addGroup(subset, color, `${badLabel} #${wafers}`, rank, true);
  }
  addBad(bad.filter(r => pastScrap(r)), LIMIT_COLORS.scrap, 1);
  addBad(bad.filter(r => pastControl(r)), LIMIT_COLORS.control, 2);
  addBad(bad.filter(r => !pastScrap(r) && !pastControl(r)), "white", 3);

  if (focusPair) {
    const [froot, fwafer] = focusPair;
    const focusRows = rows.filter(r => normLot(r.root_lot_id) === normLot(froot) && normWafer(r.wafer_id) === normWafer(fwafer));
    if (focusRows.length) {
      traces.push({
        x: focusRows.map(r => r.tkout_time),
        y: focusRows.map(r => r._val),
        mode: "markers",
        marker: { color: "rgba(0,0,0,0)", size: 18, line: { width: 3, color: "black" } },
        name: `선택 WF: ${normLot(froot)} #${normWafer(fwafer)}`,
        legendrank: 0,
        customdata: customdata(focusRows),
        hovertemplate: HOVER_TEMPLATE,
      });
    }
  }

  const shapes = [];
  const annotations = [];
  function addHline(y, color, text, atTop) {
    shapes.push({ type: "line", xref: "paper", x0: 0, x1: 1, yref: "y", y0: y, y1: y, line: { color, dash: "dash" } });
    annotations.push({
      xref: "paper", x: 0, xanchor: "left", yref: "y", y, text,
      showarrow: false, font: { color, size: 11 }, yanchor: atTop ? "bottom" : "top",
    });
  }
  if (ucl !== null) addHline(ucl, "blue", "UCL", true);
  if (lcl !== null) addHline(lcl, "blue", "LCL", false);
  if (usl !== null) addHline(usl, "red", "USL", true);
  if (lsl !== null) addHline(lsl, "red", "LSL", false);

  const layout = {
    xaxis: { title: { text: "tkout_time" } },
    yaxis: { title: { text: itemCol } },
    legend: { title: { text: legendField || "Legend" }, font: { size: 10 }, itemsizing: "constant", tracegroupgap: 0 },
    shapes, annotations,
    margin: { t: 30, b: 30, l: 55, r: 20 },
    height: 284,
  };
  return { traces, layout, measuredCount: rows.length };
}

// ---- rendering ----
const listBody = document.getElementById("listBody");
const detailPanel = document.getElementById("detailPanel");
const trendPanel = document.getElementById("trendPanel");
const commentPanel = document.getElementById("commentPanel");

let chartClickBound = false;

function renderFilterButtons() {
  document.querySelectorAll("#statusFilter button").forEach(b => {
    b.classList.toggle("active", b.dataset.val === state.statusFilter);
  });
  document.querySelectorAll("#productSwitch button").forEach(b => {
    b.classList.toggle("active", b.dataset.val === state.product);
  });
}

// what a cell actually shows -- hold_time is carried as a raw ISO string
// ("...T21:55:24") but rendered with a space, so searching has to go
// through here or typing what you see on screen matches nothing
function cellText(row, col) {
  const v = col === "hold_time" ? formatDisplayTime(row[col]) : row[col];
  return String(v ?? "");
}

function applySearchAndSort(grouped) {
  let rows = grouped;
  const q = state.searchText.trim().toLowerCase();
  if (q) {
    rows = rows.filter(row =>
      LIST_COLS.some(col => cellText(row, col).toLowerCase().includes(q))
    );
  }
  if (state.sortCol) {
    const col = state.sortCol;
    const dir = state.sortDir === "asc" ? 1 : -1;
    const isBlank = v => v === null || v === undefined || String(v).trim() === "";
    // decide numeric-vs-text once for the whole column, not per comparison:
    // mixing the two inside the comparator makes it non-transitive (with
    // "10", "9", "3,5" you get 10 > 9 > "3,5" > 10) and the sort result
    // becomes implementation-defined. wafer_id holds "3,5" style lists, so
    // that column has to compare as text throughout.
    const numericCol = rows.every(r => isBlank(r[col]) || Number.isFinite(Number(r[col])));
    rows = rows.slice().sort((a, b) => {
      const av = a[col], bv = b[col];
      let cmp;
      if (numericCol) {
        // blanks last regardless of direction
        if (isBlank(av) || isBlank(bv)) cmp = isBlank(av) && isBlank(bv) ? 0 : (isBlank(av) ? 1 : -1) * dir;
        else cmp = Number(av) - Number(bv);
      } else {
        cmp = String(av ?? "").localeCompare(String(bv ?? ""));
      }
      if (cmp !== 0) return cmp * dir;
      // same key: keep a rework above its original, as groupHolds ordered it
      return Number(b.rw_cnt || 0) - Number(a.rw_cnt || 0);
    });
  }
  return rows;
}

function renderListHeader() {
  document.querySelectorAll("#listHeaderRow th").forEach(th => {
    const arrow = th.querySelector(".sort-arrow");
    arrow.textContent = th.dataset.col === state.sortCol ? (state.sortDir === "asc" ? "▲" : "▼") : "";
  });
}

function renderList(grouped) {
  renderListHeader();
  listBody.innerHTML = "";
  applySearchAndSort(grouped).forEach(row => {
    const tr = el("tr", { "data-lot-id": row.lot_id, "data-rw-cnt": row.rw_cnt });
    if (row.lot_id === state.selectedLotId && normRwCnt(row.rw_cnt) === normRwCnt(state.selectedRwCnt)) {
      tr.classList.add("selected");
    }
    // same cellText() the search goes through, so the two can't drift apart
    LIST_COLS.forEach(col => tr.appendChild(el("td", { text: cellText(row, col) })));
    listBody.appendChild(tr);
  });
}

function renderDetail(dcAll) {
  detailPanel.innerHTML = "";
  const lotId = state.selectedLotId;
  if (lotId === null) {
    detailPanel.appendChild(el("div", { class: "caption", text: "행을 클릭하면 해당 lot 의 wafer / item 내역이 표시됩니다." }));
    return;
  }
  // every rw_cnt of the lot, not just the one the clicked row stands for --
  // seeing the original next to its rework is the point of the breakdown.
  // Read from the unfiltered rows, or the hold view would hide the
  // already-dispositioned pass and leave only the row that was clicked.
  const rows = dcAll.filter(r => r.lot_id === lotId).slice();
  // rework on top, then wafers ascending, items grouped per wafer
  rows.sort((a, b) => {
    const rw = Number(b.rw_cnt || 0) - Number(a.rw_cnt || 0);
    if (rw !== 0) return rw;
    const wa = normWafer(a.wafer_id), wb = normWafer(b.wafer_id);
    const ta = typeof wa === "number" ? 0 : 1, tb = typeof wb === "number" ? 0 : 1;
    if (ta !== tb) return ta - tb;
    if (ta === 0 ? wa !== wb : String(wa) !== String(wb)) {
      return ta === 0 ? wa - wb : String(wa).localeCompare(String(wb));
    }
    return String(a.item_id).localeCompare(String(b.item_id));
  });
  detailPanel.appendChild(el("div", { class: "caption", text: `${lotId} · ${rows.length}건` }));
  const table = el("table", { class: "data-table" });
  const thead = el("thead", {}, [el("tr", {}, ["rw_cnt", "wafer_id", "item_id", "hold_inform"].map(h => el("th", { text: h })))]);
  const tbody = el("tbody");
  rows.forEach(r => {
    tbody.appendChild(el("tr", {}, [r.rw_cnt, r.wafer_id, r.item_id, r.hold_inform].map(v => el("td", { text: v ?? "" }))));
  });
  table.appendChild(thead); table.appendChild(tbody);
  detailPanel.appendChild(table);
}

function ensureTrendSkeleton() {
  if (document.getElementById("navRow")) return;
  trendPanel.innerHTML = "";
  // the old chartDiv (and its bound plotly_click listener) was just wiped
  // out with it -- the next chart render needs to bind a fresh one to the
  // element about to be created below, or clicks on it silently do nothing
  chartClickBound = false;
  const navRow = el("div", { class: "nav-row", id: "navRow" });
  const prevBtn = el("button", { class: "nav-arrow", id: "prevBtn", text: "◀" });
  const itemLabel = el("div", { class: "item-label", id: "itemLabel" });
  const nextBtn = el("button", { class: "nav-arrow", id: "nextBtn", text: "▶" });
  const gap = el("div", { class: "gap" });
  const legendSelect = el("select", { id: "legendSelect" });
  Object.keys(LEGEND_FIELD_OPTIONS).forEach(label => legendSelect.appendChild(el("option", { value: label, text: label })));
  const resetBtn = el("button", { class: "reset-btn", id: "resetBtn", text: "차트 초기화" });
  [prevBtn, itemLabel, nextBtn, gap, legendSelect, resetBtn].forEach(c => navRow.appendChild(c));
  trendPanel.appendChild(navRow);
  trendPanel.appendChild(el("div", { id: "chartWarning" }));
  trendPanel.appendChild(el("div", { id: "chartDiv" }));
  trendPanel.appendChild(el("div", { class: "caption", id: "chartCaption" }));

  prevBtn.addEventListener("click", () => {
    const key = `${state.product}|${state.selectedLotId}|${normRwCnt(state.selectedRwCnt)}`;
    state.itemIdxByKey[key] = Math.max(0, (state.itemIdxByKey[key] ?? 0) - 1);
    renderAll();
  });
  nextBtn.addEventListener("click", () => {
    const key = `${state.product}|${state.selectedLotId}|${normRwCnt(state.selectedRwCnt)}`;
    state.itemIdxByKey[key] = (state.itemIdxByKey[key] ?? 0) + 1;
    renderAll();
  });
  legendSelect.addEventListener("change", () => {
    state.legendField = LEGEND_FIELD_OPTIONS[legendSelect.value];
    renderAll();
  });
  resetBtn.addEventListener("click", () => {
    Plotly.relayout("chartDiv", { "xaxis.autorange": true, "yaxis.autorange": true });
  });
}

function handleChartClick(clickedRoot, clickedWafer, itemId) {
  state.focusedWafer = { product: state.product, itemId, rootLotId: clickedRoot, waferId: clickedWafer };

  const fullDc = DATA.dc[state.product];
  const itemKey = String(itemId).trim().toLowerCase();
  const clickRows = fullDc.filter(r =>
    normLot(r.root_lot_id) === normLot(clickedRoot) &&
    normWafer(r.wafer_id) === normWafer(clickedWafer) &&
    String(r.item_id).trim().toLowerCase() === itemKey
  );
  // the same wafer/item can be held twice under the same lot (an original
  // pass and its rework) -- if the click matches more than one event, stay
  // on the one already in view rather than jumping away from under the
  // user; otherwise prefer the most recent rework
  let clickLotId = null, clickRwCnt = null;
  if (clickRows.length) {
    const current = clickRows.find(
      r => r.lot_id === state.selectedLotId && normRwCnt(r.rw_cnt) === normRwCnt(state.selectedRwCnt)
    );
    const pick = current || clickRows.slice().sort((a, b) => Number(b.rw_cnt || 0) - Number(a.rw_cnt || 0))[0];
    clickLotId = pick.lot_id;
    clickRwCnt = pick.rw_cnt;
  }

  if (
    clickLotId !== null &&
    (clickLotId !== state.selectedLotId || normRwCnt(clickRwCnt) !== normRwCnt(state.selectedRwCnt))
  ) {
    // only adopt it as the checked list row if it's visible under the
    // current status filter -- otherwise there's no row to check, but the
    // ring/comment below still resolve against the full (unfiltered) set
    const filtered = filterByStatus(fullDc, state.statusFilter);
    if (filtered.some(r => r.lot_id === clickLotId && normRwCnt(r.rw_cnt) === normRwCnt(clickRwCnt))) {
      // scoped to this event's rw_cnt, not the whole lot_id -- a rework
      // shares the lot_id with its original hold and must not mix items
      const newItems = uniqueOrdered(
        filtered
          .filter(r => r.lot_id === clickLotId && normRwCnt(r.rw_cnt) === normRwCnt(clickRwCnt))
          .map(r => r.item_id)
      );
      state.itemIdxByKey[`${state.product}|${clickLotId}|${normRwCnt(clickRwCnt)}`] =
        newItems.includes(itemId) ? newItems.indexOf(itemId) : 0;
      state.selectedLotId = clickLotId;
      state.selectedRwCnt = clickRwCnt;
    }
  }
  renderAll();
}

function renderTrendAndComment(dcAll, dcFiltered) {
  const lotId = state.selectedLotId;
  const rwCnt = state.selectedRwCnt;

  if (lotId === null) {
    trendPanel.innerHTML = "";
    trendPanel.appendChild(el("div", { class: "info-box", text: "왼쪽에서 hold 행을 클릭하면 trend 차트가 표시됩니다." }));
    commentPanel.innerHTML = "";
    commentPanel.appendChild(el("div", { class: "caption", text: "Comment" }));
    return;
  }

  ensureTrendSkeleton();

  // scoped to the clicked event's rw_cnt too, not just its lot_id -- a
  // rework shares the lot_id with its original hold, and without this the
  // item list, control limits and paging state below would mix both events
  const lotRows = dcFiltered.filter(r => r.lot_id === lotId && normRwCnt(r.rw_cnt) === normRwCnt(rwCnt));
  const items = uniqueOrdered(lotRows.map(r => r.item_id));
  const key = `${state.product}|${lotId}|${normRwCnt(rwCnt)}`;
  let itemIdx = state.itemIdxByKey[key] ?? 0;
  itemIdx = Math.min(itemIdx, Math.max(items.length - 1, 0));
  state.itemIdxByKey[key] = itemIdx;
  const itemId = items.length ? items[itemIdx] : null;
  // the click handler is bound once per chartDiv (see below) and reads
  // this instead of closing over itemId directly, so a stale reference
  // doesn't stick around after paging to a different item on the same
  // chartDiv without a full rebuild
  state.currentItemId = itemId;
  const itemCol = itemId !== null ? resolveItemCol(state.product, itemId) : null;

  const focus = state.focusedWafer;
  let chartFocusPair = null;
  if (focus && focus.product === state.product && focus.itemId === itemId) {
    chartFocusPair = [focus.rootLotId, focus.waferId];
  }

  document.getElementById("prevBtn").disabled = itemIdx === 0;
  document.getElementById("nextBtn").disabled = itemIdx >= items.length - 1;
  const itemLabel = document.getElementById("itemLabel");
  itemLabel.innerHTML = "";
  itemLabel.appendChild(el("b", { text: itemId ?? "" }));
  itemLabel.appendChild(document.createTextNode(" "));
  itemLabel.appendChild(el("span", { text: items.length ? `(${itemIdx + 1}/${items.length})` : "" }));
  document.getElementById("legendSelect").value = Object.keys(LEGEND_FIELD_OPTIONS).find(k => LEGEND_FIELD_OPTIONS[k] === state.legendField);

  const warningBox = document.getElementById("chartWarning");
  warningBox.innerHTML = "";
  const chartCaption = document.getElementById("chartCaption");

  if (itemCol === null) {
    warningBox.appendChild(el("div", { class: "warning-box", text: `${itemId} 에 매칭되는 trend 데이터를 찾지 못했습니다.` }));
    Plotly.purge("chartDiv");
    chartCaption.textContent = "";
  } else {
    const itemRows = lotRows.filter(r => r.item_id === itemId);
    const badPairs = new Set(itemRows.map(r => pairKey(r.root_lot_id, r.wafer_id)));
    const waferList = sortWafers(itemRows.map(r => r.wafer_id)).join(",");
    const limits = itemRows[0] || {};

    const { traces, layout, measuredCount } = buildScatterTraces(
      state.product, itemCol, badPairs, String(lotId), state.legendField,
      limits.ucl, limits.lcl, limits.usl, limits.lsl, chartFocusPair
    );
    if (measuredCount === 0) {
      warningBox.appendChild(el("div", { class: "warning-box", text: `${itemId} 은(는) 이 제품 trend 에 측정값이 없습니다.` }));
    }
    Plotly.react("chartDiv", traces, layout, { displayModeBar: true, responsive: true });
    if (!chartClickBound) {
      document.getElementById("chartDiv").on("plotly_click", (ev) => {
        const pt = ev.points && ev.points[0];
        if (!pt || !pt.customdata) return;
        handleChartClick(pt.customdata[0], pt.customdata[1], state.currentItemId);
      });
      chartClickBound = true;
    }
    chartCaption.textContent = `제품: ${state.product} · lot_id: ${lotId} · wafer_id: ${waferList} · item: ${itemId}`;
  }

  // comment panel
  commentPanel.innerHTML = "";
  let focusRows;
  if (chartFocusPair) {
    const [croot, cwafer] = chartFocusPair;
    const itemKey = itemId !== null ? String(itemId).trim().toLowerCase() : null;
    focusRows = dcAll.filter(r =>
      normLot(r.root_lot_id) === normLot(croot) &&
      normWafer(r.wafer_id) === normWafer(cwafer) &&
      (itemKey ? String(r.item_id).trim().toLowerCase() === itemKey : false)
    );
    commentPanel.appendChild(el("div", { class: "caption", text: `선택한 wafer: ${normLot(croot)} #${normWafer(cwafer)}` }));
  } else {
    focusRows = itemId !== null ? lotRows.filter(r => r.item_id === itemId) : lotRows;
  }
  commentPanel.appendChild(el("div", { class: "caption", text: "Comment" }));

  const disp = formatDisposition(focusRows);
  const commentText = disp ? disp.comment : "Comment 이력이 없습니다.";
  const ownerText = disp ? disp.owner : "-";
  const codeText = disp ? disp.code : "-";

  const textarea = el("textarea", { id: "commentText", disabled: true });
  textarea.value = commentText;
  textarea.style.height = chartFocusPair ? "86px" : "111px";
  commentPanel.appendChild(textarea);

  const dispositionDiv = el("div", { class: "disposition" });
  dispositionDiv.appendChild(el("b", { text: "owner" }));
  dispositionDiv.appendChild(document.createTextNode(`  ${ownerText}`));
  dispositionDiv.appendChild(el("br"));
  dispositionDiv.appendChild(el("b", { text: "code" }));
  dispositionDiv.appendChild(document.createTextNode(`   ${codeText}`));
  commentPanel.appendChild(dispositionDiv);
}

// ====================================================================
// WAC Trend 페이지
// ====================================================================

// 관리선은 trend 에 없고 dc 에만 있다. 같은 item 이라도 hold 마다 값이
// 달라질 수 있어서, 가장 최근 hold 의 것을 그 item 의 현재 규격으로 본다.
// dc 에 한 번도 안 걸린 item 은 관리선을 알 수 없으므로 null.
const _wacLimitCache = new Map();
function wacLimits(product, itemId) {
  const key = product + "||" + itemId;
  if (_wacLimitCache.has(key)) return _wacLimitCache.get(key);
  const want = String(itemId).trim().toLowerCase();
  let best = null;
  for (const r of DATA.dc[product]) {
    if (String(r.item_id).trim().toLowerCase() !== want) continue;
    if (!best || (r.hold_time && r.hold_time > best.hold_time)) best = r;
  }
  const lim = best ? { ucl: toFloat(best.ucl), lcl: toFloat(best.lcl),
                       usl: toFloat(best.usl), lsl: toFloat(best.lsl) } : null;
  _wacLimitCache.set(key, lim);
  return lim;
}

// 측정값이 있는 행만 한 번 추려두고 재사용한다. 클릭할 때마다 다시 훑으면
// item 20여 개 x 수천 행을 매번 되풀이하게 된다.
const _wacRowCache = new Map();
function wacRows(product, itemCol) {
  const key = product + "||" + itemCol;
  if (_wacRowCache.has(key)) return _wacRowCache.get(key);
  const out = [];
  for (const r of DATA.trend[product]) {
    const raw = r[itemCol];
    if (raw === null || raw === undefined) continue;
    const val = Number(raw);
    if (!Number.isFinite(val)) continue;
    out.push({ ...r, _val: val, _hoverTime: formatHoverTime(r.tkout_time) });
  }
  _wacRowCache.set(key, out);
  return out;
}

const WAC_SIZE = 6, WAC_SIZE_SEL = 14;

function buildWacTraces(product, itemCol, lim, sel) {
  const rows = wacRows(product, itemCol);
  const ucl = lim ? lim.ucl : null, lcl = lim ? lim.lcl : null;
  const usl = lim ? lim.usl : null, lsl = lim ? lim.lsl : null;
  const slOut = r => (usl !== null && r._val > usl) || (lsl !== null && r._val < lsl);
  const clOut = r => !slOut(r) && ((ucl !== null && r._val > ucl) || (lcl !== null && r._val < lcl));

  const selLot = sel ? normLot(sel.rootLotId) : null;
  const isSel = r => sel && normLot(r.root_lot_id) === selLot
                        && normWafer(r.wafer_id) === normWafer(sel.waferId);
  const sameLot = r => sel && normLot(r.root_lot_id) === selLot && !isSel(r);

  const g = { sl: [], cl: [], same: [], other: [] };
  for (const r of rows) {
    if (slOut(r)) g.sl.push(r);
    else if (clOut(r)) g.cl.push(r);
    else if (sameLot(r)) g.same.push(r);
    else g.other.push(r);
  }

  const traces = [];
  function add(grp, color, name, rank) {
    if (!grp.length) return;
    // 클릭한 타점만 커진다. 색은 그대로라 어느 그룹인지도 계속 보인다
    const sizes = grp.map(r => isSel(r) ? WAC_SIZE_SEL : WAC_SIZE);
    traces.push({
      x: grp.map(r => r.tkout_time), y: grp.map(r => r._val),
      mode: "markers", name, legendrank: rank,
      marker: { color, size: sizes },
      customdata: grp.map(r => [r.root_lot_id, r.wafer_id, r._hoverTime,
                                r.probe_card_id, r.eqp_id, r.lot_type, r.rw_cnt]),
      hovertemplate: HOVER_TEMPLATE,
    });
  }
  add(g.other, "lightgray", "trend", 1100);
  add(g.same, "dimgray", sel ? normLot(sel.rootLotId) : "same lot", 1050);
  add(g.cl, LIMIT_COLORS.control, "CL OUT", 20);
  add(g.sl, LIMIT_COLORS.scrap, "SL OUT", 10);

  const shapes = [], annotations = [];
  function hline(y, color, text, atTop) {
    if (y === null) return;
    shapes.push({ type: "line", xref: "paper", x0: 0, x1: 1, yref: "y", y0: y, y1: y,
                  line: { color, dash: "dash" } });
    annotations.push({ xref: "paper", x: 0, xanchor: "left", yref: "y", y, text,
                       showarrow: false, font: { color, size: 10 },
                       yanchor: atTop ? "bottom" : "top" });
  }
  hline(ucl, "blue", "UCL", true); hline(lcl, "blue", "LCL", false);
  hline(usl, "red", "USL", true);  hline(lsl, "red", "LSL", false);

  return {
    traces,
    layout: {
      xaxis: { title: { text: "tkout_time" } },
      yaxis: { title: { text: itemCol } },
      legend: { font: { size: 9 }, itemsizing: "constant", tracegroupgap: 0 },
      shapes, annotations,
      margin: { t: 24, b: 34, l: 52, r: 12 },
      height: 260,
      uirevision: itemCol,      // 클릭해도 확대/이동 상태는 유지
    },
    n: rows.length,
  };
}

function renderWac() {
  document.getElementById("wacCounts").innerHTML =
    "WAC item 수<br>" + Object.keys(DATA.trend)
      .map(p => `${p} : ${(DATA.itemCols[p] || []).length}건`).join(", ");
  document.querySelectorAll("#wacProductSwitch button").forEach(b =>
    b.classList.toggle("active", b.dataset.val === state.product));
  const search = document.getElementById("wacSearch");
  if (search.value !== state.wacSearch) search.value = state.wacSearch;

  const q = state.wacSearch.trim().toLowerCase();
  const items = (DATA.itemCols[state.product] || [])
    .filter(c => !q || String(c).toLowerCase().includes(q));

  const grid = document.getElementById("wacGrid");
  const empty = document.getElementById("wacEmpty");
  grid.innerHTML = "";
  if (!items.length) {
    empty.hidden = false;
    empty.textContent = q ? `"${state.wacSearch}" 와 맞는 item 이 없습니다.`
                          : "이 제품의 trend 에 item 컬럼이 없습니다.";
    return;
  }
  empty.hidden = true;

  items.forEach(itemCol => {
    const lim = wacLimits(state.product, itemCol);
    const box = el("div", { class: "wac-chart" });
    box.appendChild(el("div", { class: "wac-chart-title", text: itemCol }));
    if (!lim) box.appendChild(el("div", { class: "wac-nolimit",
      text: "관리선 없음 (dc 에 hold 이력이 없는 item)" }));
    const div = el("div");
    box.appendChild(div);
    grid.appendChild(box);

    const { traces, layout } = buildWacTraces(state.product, itemCol, lim, state.wacSelected);
    Plotly.react(div, traces, layout, { displayModeBar: false, responsive: true });
    div.on("plotly_click", (ev) => {
      const pt = ev.points && ev.points[0];
      if (!pt || !pt.customdata) return;
      const [root, wafer] = pt.customdata;
      const cur = state.wacSelected;
      // 같은 타점을 다시 누르면 선택 해제
      state.wacSelected = (cur && normLot(cur.rootLotId) === normLot(root)
                               && normWafer(cur.waferId) === normWafer(wafer))
        ? null : { rootLotId: root, waferId: wafer };
      renderWac();     // 모든 차트에 한 번에 반영
    });
  });
}

function renderAll() {
  if (state.page === "wac") { renderWac(); return; }
  renderFilterButtons();
  const dcAll = DATA.dc[state.product];
  const dcFiltered = filterByStatus(dcAll, state.statusFilter);
  const grouped = groupHolds(dcFiltered);
  renderList(grouped);
  renderDetail(dcAll);
  renderTrendAndComment(dcAll, dcFiltered);
}

document.getElementById("pageSwitch").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn || btn.dataset.val === state.page) return;
  state.page = btn.dataset.val;
  document.querySelectorAll("#pageSwitch button").forEach(b =>
    b.classList.toggle("active", b.dataset.val === state.page));
  document.getElementById("pageDcOcap").hidden = state.page !== "dcocap";
  document.getElementById("pageWac").hidden = state.page !== "wac";
  renderAll();
});
document.getElementById("wacProductSwitch").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  // 제품은 두 페이지가 같이 쓴다 -- 여기서 바꾸고 DC OCAP 으로 가도 그대로
  state.product = btn.dataset.val;
  state.wacSelected = null;
  renderWac();
});
document.getElementById("wacSearch").addEventListener("input", (e) => {
  state.wacSearch = e.target.value;
  renderWac();
});
document.getElementById("statusFilter").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  state.statusFilter = btn.dataset.val;
  renderAll();
});
document.getElementById("productSwitch").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  state.product = btn.dataset.val;
  state.selectedLotId = null;
  state.selectedRwCnt = null;
  renderAll();
});
listBody.addEventListener("click", (e) => {
  const tr = e.target.closest("tr[data-lot-id]");
  if (!tr) return;
  state.selectedLotId = tr.dataset.lotId;
  state.selectedRwCnt = tr.dataset.rwCnt;
  renderAll();
});
document.getElementById("listHeaderRow").addEventListener("click", (e) => {
  const th = e.target.closest("th[data-col]");
  if (!th) return;
  const col = th.dataset.col;
  if (state.sortCol === col) {
    state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
  } else {
    state.sortCol = col;
    state.sortDir = "asc";
  }
  renderAll();
});
document.getElementById("listSearch").addEventListener("input", (e) => {
  state.searchText = e.target.value;
  renderAll();
});

// nothing above this point may read DATA -- it is null until the gzipped
// payload finishes inflating
loadData().then(d => {
  DATA = d;
  // fixed order matching the product switch, not Object.keys() order
  const counts = ["ULY", "TTS", "SOL"]
    .map(p => `${p} : ${countNewHolds(DATA.dc[p] || [])}건`)
    .join(", ");
  document.getElementById("newHoldCounts").innerHTML = "신규 hold 건수<br>" + counts;
  renderAll();
}).catch(err => {
  console.error(err);
  const why = (typeof DecompressionStream === "undefined")
    ? "이 브라우저는 압축 해제 기능(DecompressionStream)을 지원하지 않습니다. Chrome 또는 Edge 최신 버전에서 열어주세요."
    : "데이터를 읽는 중 오류가 발생했습니다: " + err;
  document.getElementById("app").innerHTML =
    '<div class="warning-box" style="margin:24px;font-size:1rem;">' + why + "</div>";
});
</script>
</body>
</html>
